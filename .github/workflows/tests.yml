name: Tests

# Crédits GitHub Actions limités :
#  - à chaque push : un seul job rapide sur Ubuntu (lint + tests) ;
#  - sur les pull requests et à la demande (onglet Actions > Run workflow) : tous les systèmes
#    et la page dans un vrai navigateur.
# Pas de CI pour les changements de documentation seule.
on:
  push:
    paths-ignore:
      - "**.md"
      - "spec/**"
      - "doc/**"
      - "tools/**"
      - "captures/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "spec/**"
      - "doc/**"
      - "tools/**"
      - "captures/**"
  workflow_dispatch:

# Un nouveau push annule l'exécution précédente de la même branche.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chaque push.
  quick:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest -q

  # Pull requests et lancement manuel : tous les systèmes.
  full:
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python minimal sur Linux ; Windows et macOS (plus chers en minutes) avec le Python courant.
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest -q

  # Pull requests et lancement manuel : la page d'affichage dans un vrai navigateur (Chromium).
  page:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,browser]"
      - run: playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_page.py
