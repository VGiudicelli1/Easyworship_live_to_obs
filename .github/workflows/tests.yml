name: Tests

# Crédits GitHub Actions limités : pas de CI à chaque push de branche.
# Elle tourne sur les pull requests, sur main et à la demande (onglet Actions > Run workflow),
# et pas pour les changements de documentation seule.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "spec/**"
      - "doc/**"
      - "tools/**"
      - "captures/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "spec/**"
      - "doc/**"
      - "tools/**"
      - "captures/**"
  workflow_dispatch:

# Un nouveau push annule l'exécution précédente de la même branche.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python minimal sur Linux ; les autres systèmes (Windows et macOS coûtent plus cher
          # en minutes) seulement avec le Python courant.
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest -q

  # La page d'affichage dans un vrai navigateur (Chromium). Ignorée dans la matrice ci-dessus,
  # où Playwright n'est pas installé.
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,browser]"
      - run: playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_page.py
