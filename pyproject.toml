[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ew-to-obs"
version = "0.1.0"
description = "Affiche dans OBS le texte de la diapo en direct d'EasyWorship"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
browser = ["playwright>=1.49"]  # tests de la page dans Chromium

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ew_to_obs = ["public/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP031"]  # le style du projet (et logging) utilise le formatage « % »

[tool.ruff.lint.isort]
known-first-party = ["ew_to_obs", "replay", "fake_ew"]
